<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the bottom tab bar sit above the iPhone home indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <title>Life Tracker</title>
    <!--
      Runs before React loads so the page never "flashes" the wrong theme.
      It reads the saved choice (light / dark / system) and adds the `dark`
      class to <html> if needed. Keep the storage key in sync with
      src/theme/theme.ts.
    -->
    <script>
      try {
        var pref = JSON.parse(localStorage.getItem('lt:theme')) || 'system';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
